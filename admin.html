
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Jayguru Hub - Staff Salary</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial;color:#172033}
header{background:#172554;color:white;padding:20px;text-align:center}
main{max-width:1100px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0001}
h2{margin-top:0;color:#1e3a8a}
input,select,button{padding:12px;border:1px solid #cbd5e1;border-radius:7px;width:100%;margin:5px 0;font-size:15px}
button{background:#1d4ed8;color:white;border:0;cursor:pointer;font-weight:bold}
button.delete{background:#dc2626}
button.secondary{background:#475569}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#eff6ff;padding:15px;border-radius:9px}
.stat strong{display:block;font-size:21px;margin-top:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#eff6ff}
.paid{color:green;font-weight:bold}
.unpaid{color:#dc2626;font-weight:bold}
small{color:#64748b}
</style>
</head>
<body>

<header>
<h1>The Jayguru Hub</h1>
<p>Staff Daily Salary Management</p>
</header>

<main>

<section class="card">
<h2>1. Add Staff</h2>
<div class="grid">
<input id="staffName" placeholder="Staff Name">
<input id="staffPhone" placeholder="Mobile Number">
</div>
<button onclick="addStaff()">+ Add Staff</button>
</section>

<section class="card">
<h2>2. Daily Salary Entry</h2>
<div class="grid">
<select id="salaryStaff">
<option value="">Select Staff</option>
</select>
<input type="date" id="salaryDate">
<input type="number" id="income" placeholder="Daily Shop Income (Optional)" min="0">
<input type="number" id="salary" placeholder="Enter Salary Amount ₹" min="0">
<input type="number" id="advance" placeholder="Advance ₹" value="0" min="0">
<input type="number" id="deduction" placeholder="Deduction ₹" value="0" min="0">
<select id="status">
<option value="Unpaid">Unpaid</option>
<option value="Paid">Paid</option>
</select>
<input id="note" placeholder="Remarks (Optional)">
</div>
<button onclick="addSalary()">Save Salary</button>
</section>

<section class="card">
<h2>3. Monthly Salary Report</h2>
<input type="month" id="month" onchange="render()">
<div class="stats">
<div class="stat">Total Salary<strong id="total">₹0</strong></div>
<div class="stat">Paid<strong id="paid">₹0</strong></div>
<div class="stat">Unpaid<strong id="unpaid">₹0</strong></div>
</div>
</section>

<section class="card">
<h2>4. Date-wise Salary History</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th><th>Staff</th><th>Income</th>
<th>Salary</th><th>Advance</th><th>Deduction</th>
<th>Net</th><th>Status</th><th>Action</th>
</tr>
</thead>
<tbody id="salaryList"></tbody>
</table>
</div>
<button class="secondary" onclick="exportCSV()">Download Excel CSV</button>
</section>

<section class="card">
<h2>5. Staff List</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Name</th><th>Mobile</th><th>Action</th></tr></thead>
<tbody id="staffList"></tbody>
</table>
</div>
</section>

</main>

<script>
const KEY="jayguru_staff_salary_v1";

let db;
try{
 db=JSON.parse(localStorage.getItem(KEY)) || {staff:[],payments:[]};
 if(!Array.isArray(db.staff)) db.staff=[];
 if(!Array.isArray(db.payments)) db.payments=[];
}catch(e){
 db={staff:[],payments:[]};
}

const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 render();
}

function addStaff(){
 const name=$("staffName").value.trim();
 const phone=$("staffPhone").value.trim();

 if(!name || !phone){
  alert("Enter staff name and mobile number");
  return;
 }

 db.staff.push({
  id:Date.now()+Math.random(),
  name,phone
 });

 $("staffName").value="";
 $("staffPhone").value="";
 save();
}

function addSalary(){
 const staff=db.staff.find(s=>
  String(s.id)===$("salaryStaff").
  value);
 const date=$("salaryDate").value;
 const income=Number($("income").value||0);
 const salaryInput=$("salary").value.trim();
 const salary=Number(salaryInput);
 const advance=Number($("advance").value||0);
 const deduction=Number($("deduction").value||0);

 if(!staff || !date || salaryInput==="" || !Number.isFinite(salary) ||
    salary<0 || !Number.isFinite(income) || income<0 ||
    !Number.isFinite(advance) || advance<0 ||
    !Number.isFinite(deduction) || deduction<0 ||
    advance+deduction>salary){
  alert("Please check all salary details. Advance and deduction cannot exceed salary.");
  return;
 }

 if(db.payments.some(p=>p.staffId===staff.id && p.date===date)){
  alert("Salary entry already exists for this staff and date. Delete the old entry before adding another.");
  return;
 }

 db.payments.push({
  id:Date.now()+Math.random(),
  staffId:staff.id,
  staffName:staff.name,
  date,income,salary,advance,deduction,
  net:salary-advance-deduction,
  status:$("status").value,
  note:$("note").value.trim()
 });

 $("income").value="";
 $("salary").value="";
 $("advance").value=0;
 $("deduction").value=0;
 $("note").value="";

 save();
 alert("Salary saved successfully");
}

function deleteSalary(id){
 if(!confirm("Delete this salary record?"))return;
 db.payments=db.payments.filter(p=>p.id!==id);
 save();
}

function deleteStaff(id){
 if(db.payments.some(p=>p.staffId===id)){
  alert("Staff has salary history. Keep this record.");
  return;
 }
 if(confirm("Delete this staff member?")){
  db.staff=db.staff.filter(s=>s.id!==id);
  save();
 }
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

function render(){
 const selected=$("salaryStaff").value;

 $("salaryStaff").innerHTML=
 '<option value="">Select Staff</option>'+
 db.staff.map(s=>
 `<option value="${esc(s.id)}">${esc(s.name)}</option>`
 ).join("");

 if(db.staff.some(s=>String(s.id)===selected)){
  $("salaryStaff").value=selected;
 }

 $("staffList").innerHTML=db.staff.map(s=>`
 <tr>
 <td>${esc(s.name)}</td>
 <td>${esc(s.phone)}</td>
 <td><button class="delete" onclick="deleteStaff(${JSON.stringify(s.id)})">Delete</button></td>
 </tr>
 `).join("");

 const month=$("month").value;
 const records=db.payments
 .filter(p=>p.date.startsWith(month))
 .sort((a,b)=>b.date.localeCompare(a.date));

 $("salaryList").innerHTML=records.map(p=>`
 <tr>
 <td>${esc(p.date)}</td>
 <td>${esc(p.staffName)}</td>
 <td>${money(p.income)}</td>
 <td>${money(p.salary)}</td>
 <td>${money(p.advance)}</td>
 <td>${money(p.deduction)}</td>
 <td>${money(p.net)}</td>
 <td class="${p.status==="Paid"?"paid":"unpaid"}">${esc(p.status)}</td>
 <td><button class="delete" onclick="deleteSalary(${JSON.stringify(p.id)})">Delete</button></td>
 </tr>
 `).join("");

 const total=records.reduce((a,p)=>a+p.net,0);
 const paid=records.filter(p=>p.status==="Paid").reduce((a,p)=>a+p.net,0);
 const unpaid=records.filter(p=>p.status==="Unpaid").reduce((a,p)=>a+p.net,0);

 $("total").textContent=money(total);
 $("paid").textContent=money(paid);
 $("unpaid").textContent=money(unpaid);
}

function exportCSV(){
 const month=$("month").value;
 const records=db.payments.filter(p=>p.date.startsWith(month));

 const rows=[
 ["Date","Staff","Income","Salary","Advance","Deduction","Net","Status","Remarks"],
 ...records.map(p=>[
 p.date,p.staffName,p.income,p.salary,
 p.advance,p.deduction,p.net,p.status,p.note
 ])
 ];

 const csv=rows.map(row=>row.map(v=>
 '"'+String(v??"").replace(/"/g,'""')+'"'
 ).join(",")).join("\n");

 const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="Jayguru-Staff-Salary-"+month+".csv";
 a.click();
 URL.revokeObjectURL(url);
}

const today=new Date();
const localDate=[
 today.getFullYear(),
 String(today.getMonth()+1).padStart(2,"0"),
 String(today.getDate()).padStart(2,"0")
].join("-");
$("salaryDate").value=localDate;
$("month").value=localDate.slice(0,7);
render();
</script>

</body>
</html>
